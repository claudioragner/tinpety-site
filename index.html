<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tinpety</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    color: #212121;
    padding: 20px 16px 40px 16px;
    background-color: #ffffff;
    max-width: 780px;
    margin: 0 auto;
  }
  h1 {
    font-size: 18px;
    font-weight: bold;
    color: #1a1a2e;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    font-size: 12px;
    color: #757575;
    text-align: center;
    margin-bottom: 24px;
  }
  h2 {
    font-size: 15px;
    font-weight: bold;
    color: #1a1a2e;
    margin-top: 24px;
    margin-bottom: 8px;
    border-left: 3px solid #6200ea;
    padding-left: 8px;
  }
  p {
    margin-bottom: 10px;
    text-align: justify;
  }
  ul {
    margin: 8px 0 10px 20px;
  }
  li {
    margin-bottom: 6px;
  }
  .highlight {
    background-color: #f3e5f5;
    border-radius: 6px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #4a148c;
  }
  .footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #e0e0e0;
    font-size: 12px;
    color: #9e9e9e;
    text-align: center;
  }
  strong { color: #212121; }
  a { color: #6200ea; }
  .logo {
    max-width: 320px;
    width: 100%;
    height: auto;
    margin: 0 auto 8px;
    display: block;
  }
</style>
</head>

  <img class="logo" src="/logomarcahorizontal.png" alt="Tinpety"/>
  <p>A rede social do seu pet.</p>
  <a href="/privacidade/">Política de Privacidade e Termos de Uso</a>
  <a href="/seguranca-infantil/">Padrões de Segurança Infantil</a>

  <div class="footer">

  </div>

</html>
